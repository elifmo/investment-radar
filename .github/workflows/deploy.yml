# Dashboard deployment is handled by Netlify (connected directly to this GitHub repo).
# Netlify auto-deploys on every push to main — no workflow needed here.
#
# Setup (one-time):
#   1. netlify.com → "Add new site" → "Import an existing project" → GitHub
#   2. Select this repo (investment-radar)
#   3. Build settings:
#        Base directory:    frontend
#        Build command:     (leave empty)
#        Publish directory: frontend
#   4. Deploy — Netlify gives you a URL like https://investment-radar-xxx.netlify.app
#   5. Optional: rename site in Netlify settings
