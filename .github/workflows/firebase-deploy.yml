name: Deploy to Firebase Hosting

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - 'firebase.json'
      - 'firestore.rules'
      - 'functions/**'
      - '.firebaserc'
  workflow_dispatch:
    inputs:
      deploy_firestore_rules:
        description: "Also deploy Firestore rules (needs Firebase Rules Admin IAM role)"
        required: false
        default: false
        type: boolean
      deploy_functions:
        description: "Also deploy deep_dive function (needs Service Account User role)"
        required: false
        default: false
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13.35.1

      - name: Decide deploy targets
        id: targets
        run: |
          # Default: hosting only — CI service account lacks Firestore/Functions IAM today.
          TARGETS="hosting"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.deploy_firestore_rules }}" = "true" ]; then
              TARGETS="${TARGETS},firestore:rules"
            fi
            if [ "${{ github.event.inputs.deploy_functions }}" = "true" ]; then
              TARGETS="${TARGETS},functions:deep_dive"
            fi
          elif [ "${{ github.event_name }}" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            if git diff --name-only "$BEFORE" "$AFTER" | grep -q '^firestore.rules$'; then
              TARGETS="${TARGETS},firestore:rules"
            fi
            if git diff --name-only "$BEFORE" "$AFTER" | grep -q '^functions/'; then
              TARGETS="${TARGETS},functions:deep_dive"
            fi
          fi
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"
          echo "Deploy targets: $TARGETS"

      - name: Deploy to Firebase
        run: firebase deploy --only ${{ steps.targets.outputs.targets }} --project investment-radar-2c19d --non-interactive
