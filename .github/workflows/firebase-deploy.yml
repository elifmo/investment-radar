name: Deploy to Firebase Hosting

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - 'firebase.json'
      - 'firestore.rules'
      - 'functions/**'
      - '.firebaserc'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13.35.1

      - name: Decide deploy targets
        id: targets
        run: |
          TARGETS="hosting,firestore:rules"
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGETS="hosting,firestore:rules,functions:deep_dive"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            if git diff --name-only "$BEFORE" "$AFTER" | grep -q '^functions/'; then
              TARGETS="hosting,firestore:rules,functions:deep_dive"
            fi
          fi
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"
          echo "Deploy targets: $TARGETS"

      - name: Deploy to Firebase
        run: firebase deploy --only ${{ steps.targets.outputs.targets }} --project investment-radar-2c19d --non-interactive
