name: Investment Radar Pipeline

on:
  schedule:
    - cron: "15 15 * * 1-5"   # 18:15 TR (BIST close 18:00 + 15 min)
    - cron: "15 20 * * 1-5"   # 23:15 TR (USA close)
  workflow_dispatch:
    inputs:
      market:
        description: "usa, bist, or all"
        required: true
        default: "all"
        type: choice
        options:
          - usa
          - bist
          - all

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine market
        id: market
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "market=${{ github.event.inputs.market }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "15 15 * * 1-5" ]; then
            echo "market=bist" >> $GITHUB_OUTPUT
          else
            echo "market=usa" >> $GITHUB_OUTPUT
          fi

      - name: Run pipeline
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > serviceAccountKey.json
          python src/pipeline.py ${{ steps.market.outputs.market }}
