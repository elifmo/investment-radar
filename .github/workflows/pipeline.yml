name: Investment Radar Pipeline

on:
  schedule:
    # BIST: 10:15 TR (07:15 UTC), 14:15 TR (11:15 UTC), 18:15 TR (15:15 UTC)
    - cron: "15 7 * * 1-5"
    - cron: "15 11 * * 1-5"
    - cron: "15 15 * * 1-5"
    # USA: 16:30 TR (13:30 UTC), 20:30 TR (17:30 UTC), 23:15 TR (20:15 UTC)
    - cron: "30 13 * * 1-5"
    - cron: "30 17 * * 1-5"
    - cron: "15 20 * * 1-5"
  workflow_dispatch:
    inputs:
      market:
        description: "usa, bist, or all"
        required: true
        default: "all"
        type: choice
        options:
          - usa
          - bist
          - all

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine market
        id: market
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "market=${{ github.event.inputs.market }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "15 7 * * 1-5" ] || \
               [ "${{ github.event.schedule }}" = "15 11 * * 1-5" ] || \
               [ "${{ github.event.schedule }}" = "15 15 * * 1-5" ]; then
            echo "market=bist" >> $GITHUB_OUTPUT
          else
            echo "market=usa" >> $GITHUB_OUTPUT
          fi

      - name: Run pipeline
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > serviceAccountKey.json
          python src/pipeline.py ${{ steps.market.outputs.market }}
