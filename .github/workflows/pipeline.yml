name: Investment Radar Pipeline

on:
  schedule:
    # BIST: 10:15 TR (07:15 UTC), 14:15 TR (11:15 UTC), 18:15 TR (15:15 UTC)
    - cron: "15 7 * * 1-5"
    - cron: "15 11 * * 1-5"
    - cron: "15 15 * * 1-5"
    # USA: 16:30 TR (13:30 UTC), 20:30 TR (17:30 UTC),
    # after NY cash close: 21:20 UTC = 16:20 EST / 17:20 EDT (00:20 TR)
    - cron: "30 13 * * 1-5"
    - cron: "30 17 * * 1-5"
    - cron: "20 21 * * 1-5"
  workflow_dispatch:
    inputs:
      market:
        description: "usa, bist, or all"
        required: true
        default: "all"
        type: choice
        options:
          - usa
          - bist
          - all
      daily_reports:
        description: "Also run heatmap + ETF scan (normally 23:15 TR only)"
        required: false
        default: false
        type: boolean

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine market
        id: market
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "market=${{ github.event.inputs.market }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "15 7 * * 1-5" ] || \
               [ "${{ github.event.schedule }}" = "15 11 * * 1-5" ] || \
               [ "${{ github.event.schedule }}" = "15 15 * * 1-5" ]; then
            echo "market=bist" >> $GITHUB_OUTPUT
          else
            echo "market=usa" >> $GITHUB_OUTPUT
          fi

      - name: Write service account key
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python3 -c "import os, pathlib; pathlib.Path('serviceAccountKey.json').write_text(os.environ['FIREBASE_SERVICE_ACCOUNT'])"

      - name: Run pipeline
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # 21:20 UTC is after the NY cash close in both EST and EDT.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.daily_reports }}" = "true" ]; then
            export RUN_DAILY_REPORTS=true
          fi
          if [ "$SCHEDULE" = "20 21 * * 1-5" ]; then
            export RUN_DAILY_REPORTS=true
          fi
          EXTRA=""
          if [ "$RUN_DAILY_REPORTS" = "true" ]; then
            EXTRA="--daily"
          fi
          python src/pipeline.py ${{ steps.market.outputs.market }} $EXTRA

      # Beta V1 agents — USA only, after pipeline. Soft-fail so scoring stays up.
      # Secrets to add: ANTHROPIC_API_KEY, RADAR_USER_ID. Optional: RUN_AGENTS=false.
      - name: Run Beta V1 agents
        if: steps.market.outputs.market == 'usa' || steps.market.outputs.market == 'all'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RADAR_USER_ID: ${{ secrets.RADAR_USER_ID }}
          RUN_AGENTS: ${{ vars.RUN_AGENTS }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # Prefer the daily USA close slot; still allow manual all/usa runs.
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$SCHEDULE" != "20 21 * * 1-5" ]; then
            echo "Skipping agents on non-daily USA slot ($SCHEDULE)"
            exit 0
          fi
          python -m src.agents.run_v1
