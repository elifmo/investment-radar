# Minimum score threshold — candidates below this are filtered out
min_score: 65

# Scan timeframe for top-stock ranking: daily | 4h
scan:
  timeframe: 4h

# Signal weights (sum = 100)
weights:
  ema_alignment: 20       # EMA5 > EMA20 > EMA50
  rsi_health: 15          # RSI between 40-70 (healthy)
  volume_spike: 20        # volume > 1.5x 20-day average
  price_momentum: 15      # daily change > +1%
  bollinger_position: 10  # price above BB middle band
  sr_proximity: 10        # price within 5% of support
  breakout: 10            # price broke above resistance

# Event filter thresholds (Step 1 scan) — daily
thresholds:
  volume_spike_ratio: 1.5
  price_move_pct: 2.0
  rsi_oversold: 35
  rsi_bounce_lookback: 5   # bars to look back for RSI < oversold
  support_proximity_pct: 2.0
  high_52w_buffer_pct: 1.0

# Event filter thresholds when scan.timeframe = 4h
thresholds_4h:
  volume_spike_ratio: 1.5
  price_move_pct: 1.0      # lower bar threshold for 4H candles
  rsi_oversold: 35
  rsi_bounce_lookback: 5
  support_proximity_pct: 2.0

# Decision engine thresholds (Task 0 backtest will refine these)
decision:
  rs_threshold: 70          # RS Rating minimum for the "high RS" path
  drop_threshold: -0.20     # 30d return threshold for contrarian dip path (negative)
  sector_long_window: 126   # trading days for long-term sector window (~6 months)
  sector_short_window: 20   # trading days for short-term sector RS
  sector_short_mom_window: 10  # days for short-term momentum delta
  sector_long_mom_window: 20   # days for long-term momentum delta
  macro_trend_window: 20    # days for TNX/DXY trend calculation
  macro_smooth_window: 5    # days for smoothing the trend signal
  rs_window: 30             # trading days for RS rating return calculation
