<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Investment Radar — BIST</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f1117; color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px; min-height: 100vh;
    }
    header {
      background: #1a1d27; border-bottom: 1px solid #2d3148;
      padding: 14px 24px; display: flex; align-items: center; justify-content: space-between;
    }
    header h1 { font-size: 18px; font-weight: 700; color: #fff; }
    header h1 span { color: #e11d48; }
    #last-updated { color: #64748b; font-size: 12px; }

    .layout {
      display: grid; grid-template-columns: 1fr 340px;
      height: calc(100vh - 57px); overflow: hidden;
    }
    .panel-left {
      overflow-y: auto; padding: 20px 16px 20px 24px;
      border-right: 1px solid #2d3148;
    }
    .panel-header {
      display: flex; align-items: baseline; justify-content: space-between;
      margin-bottom: 14px;
    }
    .panel-title { font-size: 13px; font-weight: 700; color: #e2e8f0; }
    .panel-date  { font-size: 12px; }
    .date-today     { color: #4ade80; }
    .date-yesterday { color: #94a3b8; }
    .date-stale     { color: #fb923c; }
    .market-open-tag {
      display: inline-block; font-size: 10px; font-weight: 700;
      background: #3b1f0a; color: #fb923c; border-radius: 4px;
      padding: 1px 6px; margin-right: 6px; vertical-align: middle;
    }
    .timeframe-badge {
      display: inline-block; font-size: 10px; font-weight: 700;
      background: #1e2a4a; color: #93c5fd; border-radius: 4px;
      padding: 1px 6px; margin-right: 6px; vertical-align: middle;
    }
    .scan-meta {
      display: inline; font-size: 11px; color: #94a3b8; margin-left: 6px;
    }
    .scan-meta .window { color: #cbd5e1; font-weight: 600; }

    .scan-warning {
      background: #3b1f0a; border: 1px solid #92400e; border-radius: 8px;
      padding: 10px 14px; margin-bottom: 12px; font-size: 12px;
      color: #fdba74; line-height: 1.5;
    }
    .scan-warning strong { color: #fb923c; }

    table { width: 100%; border-collapse: collapse; }
    thead th {
      text-align: left; padding: 8px 10px; font-size: 11px; font-weight: 600;
      color: #64748b; text-transform: uppercase; letter-spacing: 0.06em;
      border-bottom: 1px solid #2d3148; white-space: nowrap;
    }
    tbody tr { cursor: pointer; border-bottom: 1px solid #1e2130; transition: background 0.1s; }
    tbody tr:hover   { background: #1e2130; }
    tbody tr.selected { background: #1e2338; }
    tbody td { padding: 10px; vertical-align: middle; }

    .ticker-cell { font-weight: 700; color: #fff; font-size: 14px; }
    .close-cell  { font-size: 13px; color: #cbd5e1; font-weight: 500; white-space: nowrap; }
    .score-cell  { font-weight: 700; font-size: 15px; }
    .score-high  { color: #4ade80; }
    .score-mid   { color: #facc15; }
    .score-low   { color: #f87171; }
    .why-cell    { color: #94a3b8; max-width: 220px; font-size: 12px; line-height: 1.4; }

    .streak-badge {
      display: inline-flex; align-items: center; gap: 2px;
      font-size: 11px; font-weight: 700; padding: 2px 7px;
      border-radius: 20px; white-space: nowrap;
    }
    .streak-1   { background: #1e2130; color: #64748b; }
    .streak-2   { background: #1e3b2b; color: #4ade80; }
    .streak-3   { background: #2d3a1a; color: #a3e635; }
    .streak-hot { background: #3b1f0a; color: #fb923c; }

    .panel-right { overflow-y: auto; padding: 20px; background: #131520; }
    .detail-empty {
      display: flex; align-items: center; justify-content: center;
      height: 100%; color: #4b5563; font-size: 13px; text-align: center; line-height: 1.8;
    }
    .detail-ticker { font-size: 22px; font-weight: 800; color: #fff; margin-bottom: 4px; }
    .detail-close  { font-size: 16px; color: #94a3b8; margin-bottom: 4px; }
    .detail-score  { display: inline-block; font-size: 28px; font-weight: 800; margin-bottom: 12px; }
    .detail-why {
      color: #94a3b8; font-size: 13px; line-height: 1.6; margin-bottom: 16px;
      background: #1a1d27; border-radius: 8px; padding: 12px;
      border-left: 3px solid #e11d48;
    }
    .detail-section { margin-bottom: 16px; }
    .detail-section h3 {
      font-size: 11px; font-weight: 600; color: #64748b;
      text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px;
    }
    .signal-list { list-style: none; }
    .signal-list li { font-size: 12px; padding: 4px 0; line-height: 1.5; color: #cbd5e1; }

    .kv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
    .kv-item { background: #1a1d27; border-radius: 6px; padding: 10px 12px; }
    .kv-label { font-size: 10px; color: #64748b; text-transform: uppercase; letter-spacing: 0.06em; }
    .kv-value { font-size: 15px; font-weight: 700; color: #fff; margin-top: 2px; }
    .kv-value.green  { color: #4ade80; }
    .kv-value.red    { color: #f87171; }
    .kv-value.yellow { color: #facc15; }

    .status-row { text-align: center; padding: 40px; color: #4b5563; font-size: 13px; }
  </style>
</head>
<body>

<header>
  <h1>Investment <span>Radar</span> <span style="font-size:13px;color:#64748b;font-weight:400;">🇹🇷 BIST</span></h1>
  <span id="last-updated">Loading...</span>
</header>

<div class="layout">
  <div class="panel-left">
    <div class="panel-header">
      <span class="panel-title">🇹🇷 BIST 100</span>

    <div id="scan-warning" class="scan-warning" hidden></div>
    <table>
      <thead>
        <tr>
          <th>Ticker</th><th>Sektör</th><th>Close</th><th>Score</th><th>Streak</th><th>Why Today</th>

    <div class="detail-empty">← Select a stock<br>to see details</div>

</div>

<script type="module">

  import {
    getFirestore, collection, getDocs, getDoc, doc, query, where
  } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey:            "AIzaSyBIG3tZFNq_cSAWmEHx2nWsQOKBpD-YE-g",
    authDomain:        "investment-radar-2c19d.firebaseapp.com",
    projectId:         "investment-radar-2c19d",
    storageBucket:     "investment-radar-2c19d.firebasestorage.app",
    messagingSenderId: "751620919009",
    appId:             "1:751620919009:web:2ddb9840e1ddb641d8b1a0",
  };

  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);

  const MARKET = { openUTC: 7*60+0, closeUTC: 15*60+5 };

  const BIST_COMPANIES = {
    AKBNK:"Akbank",AKSEN:"Aksa Enerji",ALARK:"Alarko Holding",ARCLK:"Arçelik",
    ASELS:"Aselsan",ASTOR:"Astor Enerji",BIMAS:"BİM Mağazalar",BRISA:"Brisa Bridgestone",

    EKGYO:"Emlak Konut GYO",ENKAI:"Enka İnşaat",EREGL:"Ereğli Demir Çelik",FROTO:"Ford Otosan",
    GARAN:"Garanti BBVA",GUBRF:"Gübre Fabrikaları",HALKB:"Halkbank",HEKTS:"Hektaş",
    ISCTR:"İş Bankası",ISGYO:"İş GYO",KCHOL:"Koç Holding",KORDS:"Kordsa",
    KRDMD:"Kardemir",LOGO:"Logo Yazılım",MGROS:"Migros",ODAS:"Odaş Elektrik",

    ENJSA:"Enerjisa Enerji",FENER:"Fenerbahçe",FRIGO:"Frigo-Pak",GESAN:"Gesan",
    INDES:"İndeks Bilgisayar",ISDMR:"İskenderun Demir",KAREL:"Karel Elektronik",
    MAVI:"Mavi Giyim",NTHOL:"Net Holding",PARSN:"Parsan",SELEC:"Selçuk Ecza",
    SOKM:"Şok Marketler",TKNSA:"Teknosa",TMSN:"Tümosan",VESBE:"Vestel Beyaz Eşya",
    YATAS:"Yataş",KOZAL:"Koza Altın",KOZAA:"Koza Anadolu",MPARK:"MedicalPark",
    TURSG:"Türkiye Sigorta",AKSA:"Aksa Akrilik",AGHOL:"AG Anadolu Grubu",
    KONTR:"Kontrolmatik",PENTA:"Penta Teknoloji",AYDEM:"Aydem Enerji",
    ALKIM:"Alkim Alkali",QUAGR:"Quaranta Agri",REEDR:"Reeder Teknoloji",
    SMRTG:"Smart Güneş",NETAS:"Netaş Telekomünikasyon",LIDER:"Lider Faktoring",
    ULUFA:"Ulusal Faktoring",BAGFS:"Bagfaş",BUCIM:"Bursa Çimento",IPEKE:"İpek Doğal Enerji",
    EGEEN:"Ege Endüstri",RAYSG:"Ray Sigorta",GLYHO:"Global Yatırım Holding",
    JANTS:"Jantsa",CEMTS:"Çemaş",EUPWR:"Europower Enerji",
  };

  const BIST_SECTORS = {
    AKBNK:"Bankacılık",GARAN:"Bankacılık",HALKB:"Bankacılık",ISCTR:"Bankacılık",
    SKBNK:"Bankacılık",VAKBN:"Bankacılık",YKBNK:"Bankacılık",
    AKSEN:"Enerji",ASTOR:"Enerji",ODAS:"Enerji",AYDEM:"Enerji",CWENE:"Enerji",
    ENJSA:"Enerji",EUPWR:"Enerji",SMRTG:"Enerji",IPEKE:"Enerji",EGEEN:"Enerji",
    ALARK:"Holding",DOHOL:"Holding",KCHOL:"Holding",SAHOL:"Holding",TKFEN:"Holding",
    AGHOL:"Holding",GLYHO:"Holding",NTHOL:"Holding",
    ARCLK:"Tüketim",DOAS:"Otomotiv",FROTO:"Otomotiv",OTKAR:"Otomotiv",TOASO:"Otomotiv",
    TTRAK:"Otomotiv",TMSN:"Otomotiv",
    ASELS:"Savunma",
    BIMAS:"Perakende",MGROS:"Perakende",SOKM:"Perakende",TKNSA:"Perakende",
    ULKER:"Gıda",CCOLA:"İçecek",AEFES:"İçecek",
    EKGYO:"GYO",ISGYO:"GYO",SMRTG:"GYO",
    EREGL:"Demir-Çelik",KRDMD:"Demir-Çelik",ISDMR:"Demir-Çelik",
    PETKM:"Petrokimya",SASA:"Petrokimya",TUPRS:"Petrokimya",
    CIMSA:"Çimento",OYAKC:"Çimento",BUCIM:"Çimento",CEMTS:"Çimento",
    LOGO:"Teknoloji",KAREL:"Teknoloji",INDES:"Teknoloji",PENTA:"Teknoloji",
    NETAS:"Teknoloji",REEDR:"Teknoloji",
    TCELL:"Telekom",TTKOM:"Telekom",
    PGSUS:"Havacılık",TAVHL:"Havacılık",THYAO:"Havacılık",TURSG:"Havacılık",
    FENER:"Spor",
    ENKAI:"İnşaat",KONTR:"İnşaat",
    SISE:"Cam",BRISA:"Lastik",GUBRF:"Gübre",BAGFS:"Gübre",ALKIM:"Kimya",
    HEKTS:"Tarım",KORDS:"Tekstil",MAVI:"Tekstil",YATAS:"Tekstil",VESTL:"Elektronik",
    VESBE:"Elektronik",AKGRT:"Sigorta",TURSG:"Sigorta",RAYSG:"Sigorta",
    KOZAL:"Madencilik",KOZAA:"Madencilik",
    MPARK:"Sağlık",SELEC:"Sağlık",FRIGO:"Gıda",PARSN:"Makine",GESAN:"Elektrik",
    LIDER:"Faktoring",ULUFA:"Faktoring",
  };

  function marketHasClosed() {
    const now = new Date();
    const day = now.getUTCDay();
    if (day === 0 || day === 6) return true;
    return (now.getUTCHours() * 60 + now.getUTCMinutes()) >= MARKET.closeUTC;
  }

  function isMarketOpen() {
    const now = new Date();
    const day = now.getUTCDay();
    if (day === 0 || day === 6) return false;
    const mins = now.getUTCHours() * 60 + now.getUTCMinutes();
    return mins >= MARKET.openUTC && mins < MARKET.closeUTC;
  }

  let candidates = [];

  const IST = "Europe/Istanbul";

  function localDateStr(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  }

  function marketTodayStr(tz) {
    return new Intl.DateTimeFormat("en-CA", { timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
  }

  function pickLatestMeta(metaByDate) {
    const dates = Object.keys(metaByDate).sort().reverse();
    return dates.length ? metaByDate[dates[0]] : null;
  }

  function marketDateOffset(daysAgo, tz) {
    const d = new Date();
    d.setDate(d.getDate() - daysAgo);
    return new Intl.DateTimeFormat("en-CA", { timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit" }).format(d);
  }

  async function hasCandidatesOn(dateStr) {
    const snap = await getDocs(query(
      collection(db, "daily_candidates"),
      where("market", "==", "BIST"),
      where("date", "==", dateStr)
    ));
    return !snap.empty;
  }

  async function newerDatesAllEmpty(sinceDate, tz) {
    for (let i = 0; i < 7; i++) {
      const dateStr = marketDateOffset(i, tz);
      if (dateStr <= sinceDate) continue;
      if (await hasCandidatesOn(dateStr)) return false;
    }
    return true;
  }

  async function findLatest() {
    const startFrom = marketHasClosed() ? 0 : 1;
    const metaByDate = {};
    try {
      const metaSnap = await getDocs(query(collection(db, "scan_meta"), where("market", "==", "BIST")));
      metaSnap.docs.forEach(d => { metaByDate[d.data().date] = d.data(); });
    } catch (e) { console.warn("scan_meta load failed:", e); }

    const latestMeta = pickLatestMeta(metaByDate);

    let metaOnly = null;
    let result = null;

    for (let i = startFrom; i < 7; i++) {
      const dateStr = marketDateOffset(i, IST);
      const snap = await getDocs(query(
        collection(db, "daily_candidates"),
        where("market", "==", "BIST"),
        where("date",   "==", dateStr)
      ));
      if (!snap.empty) {
        result = { docs: snap.docs, date: dateStr, daysAgo: i, meta: metaByDate[dateStr] || null, latestMeta };
        break;
      }
      if (metaByDate[dateStr] && !metaOnly) {
        metaOnly = { docs: [], date: dateStr, daysAgo: i, meta: metaByDate[dateStr], latestMeta };
      }
    }
    if (!result) {
      if (!metaOnly) return null;
      result = metaOnly;
    }

    const emptyScanWarning = await newerDatesAllEmpty(result.date, IST);
    return { ...result, emptyScanWarning };
  }

  function localMins(iso, tz) {
    const p = new Intl.DateTimeFormat("en-US", {
      hour: "2-digit", minute: "2-digit", hour12: false, timeZone: tz,
    }).formatToParts(new Date(iso));
    return Number(p.find(x => x.type === "hour").value) * 60 + Number(p.find(x => x.type === "minute").value);
  }

  function deriveBistWindowFromEval(iso) {
    const mins = localMins(iso, IST);
    if (mins >= 18 * 60 + 15 || mins < 10 * 60 + 15) return "Kapanış · İstanbul";
    if (mins < 14 * 60 + 15) return "10:00 – 14:00 · İstanbul";
    return "14:00 – 18:00 · İstanbul";
  }

  function bistWindowLabel(raw, daysAgo, evaluatedAt) {
    if (evaluatedAt) return deriveBistWindowFromEval(evaluatedAt);
    const s = (raw || "").toLowerCase();
    if (s.includes("10:00") && s.includes("14:00")) return "10:00 – 14:00 · İstanbul";
    if (s.includes("14:00") && s.includes("18:00")) return "14:00 – 18:00 · İstanbul";
    if (s.includes("kapanış") || s.includes("close")) return "Kapanış · İstanbul";
    return bistSessionFallback(daysAgo);
  }

  function bistSessionFallback(daysAgo) {
    if (daysAgo >= 1) return "Kapanış · İstanbul";
    const now = new Date();
    const tr = new Intl.DateTimeFormat("tr-TR", {
      hour: "2-digit", minute: "2-digit", hour12: false, timeZone: IST,
    }).formatToParts(now);
    const h = Number(tr.find(p => p.type === "hour").value);
    const m = Number(tr.find(p => p.type === "minute").value);
    const mins = h * 60 + m;
    if (mins < 14 * 60 + 30) return "10:00 – 14:00 · İstanbul";
    if (mins < 18 * 60 + 30) return "14:00 – 18:00 · İstanbul";
    return "Kapanış · İstanbul";
  }

  function fmtUpdatedIST(iso) {
    if (!iso) return "";
    return new Date(iso).toLocaleString("tr-TR", {
      day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", timeZone: IST,
    });
  }

  function renderScanWarning(result) {
    const el = document.getElementById("scan-warning");
    if (!el) return;
    const show = result?.emptyScanWarning && (result.daysAgo > 0 || candidates.length === 0);
    if (!show) {
      el.hidden = true;
      el.innerHTML = "";
      return;
    }
    el.hidden = false;
    const open = isMarketOpen();
    const latestIsToday = result.latestMeta?.date === marketTodayStr(IST);
    if (result.daysAgo > 0) {
      el.innerHTML = open && latestIsToday
        ? `<strong>⚠ Bugün piyasa açık</strong> — bu taramada yeterli aday yok. Alttaki liste önceki oturuma ait.`
        : `<strong>⚠ Son taramada yeterli aday yok.</strong> Alttaki liste önceki oturuma ait.`;
    } else {
      el.innerHTML = open
        ? `<strong>⚠ Bugün piyasa açık</strong> — yeterli aday bulunamadı.`
        : `<strong>⚠ Son taramada</strong> yeterli aday bulunamadı.`;
    }
  }

  async function loadBIST() {
    const tbody = document.getElementById("tbody-bist");
    try {
      const result = await findLatest();
      if (!result) {
        tbody.innerHTML = `<tr class="status-row"><td colspan="5">No data yet.<br>
          <small style="color:#64748b">Run: python pipeline.py bist</small></td></tr>`;
        document.getElementById("date-bist").textContent = "No data";
        renderScanWarning(null);
        return;
      }

      candidates = result.docs.map(d => ({ id: d.id, ...d.data() }));
      candidates.sort((a, b) => (b.score ?? 0) - (a.score ?? 0));

      const niceDate = new Date(result.date + "T12:00:00").toLocaleDateString("tr-TR", {
        weekday: "short", month: "short", day: "numeric", year: "numeric", timeZone: IST,
      });
      const sample     = candidates[0] || {};
      const headerMeta = result.meta || result.latestMeta || sample;
      const tfBadge    = `<span class="timeframe-badge">4H ANALİZ</span>`;
      const window     = bistWindowLabel(headerMeta.session_window, result.daysAgo, headerMeta.evaluated_at);
      const updated    = fmtUpdatedIST(headerMeta.evaluated_at);
      const openTag   = isMarketOpen() ? `<span class="market-open-tag">⚠ AÇIK</span>` : "";
      const dateClass = result.daysAgo === 0 ? "date-today" : result.daysAgo === 1 ? "date-yesterday" : "date-stale";
      const stale     = result.daysAgo >= 2 ? ` · ${result.daysAgo} gün önce` : "";
      const meta = `<span class="scan-meta" title="Bu 4 saatlik dilim için hesaplanan skorlar">⏱ <span class="window">${window}</span>${updated ? ` · güncellendi ${updated}` : ""}</span>`;
      document.getElementById("date-bist").innerHTML =
        `${openTag}${tfBadge}<span class="${dateClass}">${niceDate}${stale}</span>${meta}`;

      const openPart  = isMarketOpen() ? " · ⚠ Açık" : "";
      const stalePart = result.daysAgo >= 2 ? ` · ${result.daysAgo}g önce` : "";
      document.getElementById("last-updated").textContent =
        `🇹🇷 BIST${openPart} · ${niceDate}${stalePart} · ${window}`;

      renderScanWarning(result);
      renderTable();
    } catch (err) {
      console.error("Error loading BIST:", err);
      tbody.innerHTML = `<tr class="status-row"><td colspan="5">Firebase error — check DevTools (F12).</td></tr>`;
    }
  }

  function scoreClass(s) { return s >= 75 ? "score-high" : s >= 65 ? "score-mid" : "score-low"; }

  function streakBadge(streak) {
    if (!streak || streak < 2) return `<span class="streak-badge streak-1">1d</span>`;
    if (streak >= 5)           return `<span class="streak-badge streak-hot">🔥${streak}d</span>`;
    if (streak >= 3)           return `<span class="streak-badge streak-3">▲${streak}d</span>`;
    return                            `<span class="streak-badge streak-2">▲${streak}d</span>`;
  }

  function fmtClose(c) {
    if (c.close == null) return "—";
    return "₺" + Number(c.close).toLocaleString("tr-TR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function renderTable() {
    const tbody = document.getElementById("tbody-bist");
    if (candidates.length === 0) {
      tbody.innerHTML = `<tr class="status-row"><td colspan="5">Bugün aday yok (min skor 65).<br>
        <small style="color:#64748b">Son tarama tamamlandı; kriterleri geçen hisse bulunamadı.</small></td></tr>`;
      document.getElementById("detail-bist").innerHTML =
        `<div class="detail-empty">Bugün aday çıkmadı.<br><small style="color:#64748b">Pipeline çalıştı, liste boş.</small></div>`;
      return;
    }
    tbody.innerHTML = candidates.map(c => {
      const score = c.score ?? 0;
      return `
        <tr data-ticker="${c.ticker}">
          <td class="ticker-cell">${c.ticker.replace(".IS", "")}</td>
          <td style="font-size:11px;color:#64748b;">${BIST_SECTORS[c.ticker.replace(".IS","")] ?? "-"}</td>
          <td class="close-cell">${fmtClose(c)}</td>
          <td class="score-cell ${scoreClass(score)}">${score}</td>
          <td>${streakBadge(c.streak)}</td>
          <td class="why-cell">${c.why_today ?? "-"}</td>
        </tr>`;
    }).join("");

    document.querySelectorAll("#tbody-bist tr[data-ticker]").forEach(row => {
      row.addEventListener("click", () => {
        document.querySelectorAll("#tbody-bist tr").forEach(r => r.classList.remove("selected"));
        row.classList.add("selected");
        showDetail(row.dataset.ticker);
      });
    });
  }

  function showDetail(ticker) {
    const c = candidates.find(x => x.ticker === ticker);
    if (!c) return;
    const score = c.score ?? 0;
    const kv = (label, val, cls = "") =>
      val != null ? `<div class="kv-item"><div class="kv-label">${label}</div><div class="kv-value ${cls}">${val}</div></div>` : "";
    const rrVal  = c.risk_reward  ? parseFloat(c.risk_reward)  : null;
    const volVal = c.volume_ratio ? parseFloat(c.volume_ratio) : null;
    document.getElementById("detail-bist").innerHTML = `
      <div style="margin-bottom:12px;">
        <div class="detail-ticker">${c.ticker.replace(".IS", "")} ${streakBadge(c.streak)}</div>
        ${BIST_COMPANIES[c.ticker.replace(".IS","")] ? `<div style="font-size:12px;color:#94a3b8;margin-bottom:2px;">${BIST_COMPANIES[c.ticker.replace(".IS","")]}</div>` : ""}
        ${BIST_SECTORS[c.ticker.replace(".IS","")] ? `<div style="font-size:11px;color:#6366f1;font-weight:600;margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em;">${BIST_SECTORS[c.ticker.replace(".IS","")]}</div>` : ""}
        <div class="detail-close">${fmtClose(c)}</div>
        <div class="detail-score ${scoreClass(score)}">${score}<span style="font-size:14px;color:#64748b;"> / 100</span></div>
      </div>
      <div class="detail-why">${c.why_today ?? "No summary available."}</div>
      <div class="kv-grid">
        ${kv("Close",      fmtClose(c))}
        ${kv("Support",    c.support    != null ? "₺" + Number(c.support).toFixed(2)    : null, "green")}
        ${kv("Resistance", c.resistance != null ? "₺" + Number(c.resistance).toFixed(2) : null, "red")}
        ${rrVal  ? kv("Risk / Reward", `1:${rrVal}`,  rrVal  >= 1.5 ? "green" : "yellow") : ""}
        ${volVal ? kv("Volume",        `${volVal}x`,  volVal >= 1.5 ? "green" : "yellow") : ""}
        ${kv("RSI", c.rsi != null ? c.rsi : null, c.rsi >= 70 ? "yellow" : "green")}
      </div>
      ${c.triggers?.length ? `
        <div class="detail-section">
          <h3>Triggered by</h3>
          <ul class="signal-list">${c.triggers.map(t => `<li>• ${t.replace(/_/g," ")}</li>`).join("")}</ul>
        </div>` : ""}`;
  }

  loadBIST();
</script>
</body>
</html>
